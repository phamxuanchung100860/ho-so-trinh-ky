<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Quản lý người dùng')}"></head><body class="layout-fixed sidebar-expand-lg bg-body-tertiary"><div class="app-wrapper"><nav th:replace="~{fragments/layout :: topbar}"></nav><aside th:replace="~{fragments/layout :: sidebar}"></aside><main class="app-main"><div class="app-content"><div class="container-fluid"><div class="mb-3"><h1 class="page-title">Quản lý người dùng</h1><div class="page-subtitle">Danh sách người lập, người ký và quản trị viên</div></div><div class="card"><div class="card-header">Danh sách tài khoản</div><div class="table-responsive"><table class="table table-hover mb-0"><thead><tr><th>STT</th><th>Tài khoản</th><th>Họ tên</th><th>Phòng ban</th><th>Chức vụ</th><th>Vai trò</th><th>Trạng thái</th></tr></thead><tbody><tr th:each="u,st:${users}"><td th:text="${st.count}"></td><td class="fw-semibold" th:text="${u.username}"></td><td th:text="${u.fullName}"></td><td th:text="${u.department}"></td><td th:text="${u.position}"></td><td><span class="badge" th:classappend="${u.role.name() == 'ADMIN' ? ' text-bg-danger' : (u.role.name() == 'APPROVER' ? ' text-bg-primary' : ' text-bg-secondary')}" th:text="${u.role}"></span></td><td><span class="badge text-bg-success" th:if="${u.active}">Hoạt động</span><span class="badge text-bg-secondary" th:unless="${u.active}">Khóa</span></td></tr></tbody></table></div></div></div></div></main><footer class="app-footer">Phần mềm quản lý và trình ký hồ sơ</footer><div th:replace="~{fragments/layout :: scripts}"></div></div></body></html>
