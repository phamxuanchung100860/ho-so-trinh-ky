<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng nhập - Trình ký hồ sơ</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@4.9.1/dist/css/adminlte.min.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body class="login-page"><div class="login-box"><div class="card login-card"><div class="row g-0"><div class="col-md-6 login-hero"><div class="mb-4"><i class="bi bi-file-earmark-check fs-1"></i></div><h1>Số hóa<br>quy trình trình ký hồ sơ</h1><p class="mt-3">Tạo hồ sơ, thiết lập luồng ký, phê duyệt và theo dõi toàn bộ lịch sử trên một hệ thống.</p><div class="login-feature"><span><i class="bi bi-file-earmark-plus"></i> Tạo hồ sơ</span><span><i class="bi bi-pen"></i> Trình ký</span></div><div class="login-feature"><span><i class="bi bi-check-circle"></i> Phê duyệt</span><span><i class="bi bi-clock-history"></i> Nhật ký</span></div></div><div class="col-md-6 login-form"><div class="text-center mb-4"><h3 class="fw-bold">Đăng nhập</h3><p class="text-muted mb-0">Vui lòng đăng nhập để tiếp tục</p></div><div th:if="${param.error}" class="alert alert-danger py-2">Tài khoản hoặc mật khẩu không đúng.</div><div th:if="${param.logout}" class="alert alert-success py-2">Đã đăng xuất khỏi hệ thống.</div><form method="post" action="/login"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="mb-3"><label class="form-label">Tài khoản</label><div class="input-group"><span class="input-group-text"><i class="bi bi-person"></i></span><input name="username" class="form-control" placeholder="Nhập tài khoản" required></div></div><div class="mb-3"><label class="form-label">Mật khẩu</label><div class="input-group"><span class="input-group-text"><i class="bi bi-lock"></i></span><input type="password" name="password" class="form-control" placeholder="Nhập mật khẩu" required></div></div><div class="form-check mb-3"><input class="form-check-input" type="checkbox" id="remember"><label class="form-check-label" for="remember">Ghi nhớ đăng nhập</label></div><button class="btn btn-primary w-100 py-2">Đăng nhập</button></form><div class="text-center small text-muted mt-4">Demo: nguyenana / 123456</div></div></div></div></div></body></html>
